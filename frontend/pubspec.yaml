name: hosspi_hms
description: HOSSPI Hospital Management System frontend.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  connectivity_plus: ^7.2.0
  dio: ^5.10.0
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  intl: ^0.20.2
  phone_numbers_parser: ^9.0.24
  shared_preferences: ^2.5.5
  web: ^1.1.1
  web_socket_channel: ^3.0.3
  file_selector: ^1.1.0
  cupertino_icons: ^1.0.9
  crop_your_image: ^2.0.0
  speech_to_text: 7.4.0

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  patrol: ^4.6.1
  riverpod_lint: ^3.1.4

patrol:
  app_name: HOSSPI Hospital Management System
  test_directory: patrol_test
  android:
    package_name: com.example.flutter_template
  ios:
    bundle_id: com.example.flutterTemplate
  macos:
    bundle_id: com.example.flutterTemplate

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logos/logo.png
    - assets/logos/favicon.png
    - assets/logos/splash.png
    - assets/images/payment_providers/
  fonts:
    - family: HosspiSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
