name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  frontend-quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli

      - name: Add pub cache to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify codegen is current
        run: git diff --exit-code -- .

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Integration smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a flutter test integration_test

      - name: Patrol smoke (web)
        env:
          PATROL_GIT_SHA: ${{ github.sha }}
        run: |
          chmod +x tool/run_patrol_tests.sh
          ./tool/run_patrol_tests.sh patrol_test/smoke_test.dart

      - name: Upload Patrol web artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-failure-artifacts
          path: |
            frontend/build/patrol_reports/**
            frontend/build/patrol_web_results/**
            frontend/build/patrol_web_report/**

  backend-quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate backend delivery contract
        run: npm run validate:delivery
